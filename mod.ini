[AgaveFinder]

; @label Agave Markers
; @description The distance to each agave plant near you that has seeds, shown over the plant and drawn through terrain. A plant without seeds shows nothing until it regrows.
; @type boolean
; @default true
; @menu main, ingame
; @apply live
Markers=true

; @label Marker Range (m)
; @description Only agave plants within this distance of you show a marker.
; @type integer
; @min 50
; @max 2000
; @step 50
; @default 100
; @menu main, ingame
; @apply live
MarkerRangeMeters=100
